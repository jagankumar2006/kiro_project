<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student To-Do</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Header -->
  <header class="app-header">
    <h1>📚 Student To-Do</h1>
    <div class="header-right">
      <span id="header-username"></span>
      <button id="logout-btn" class="btn btn-ghost btn-sm">Logout</button>
    </div>
  </header>

  <main class="app-main">

    <!-- Error banner -->
    <div class="error-banner hidden" id="error-banner" role="alert" aria-live="polite"></div>

    <!-- Toolbar -->
    <div class="toolbar">
      <input type="text" id="search-input" placeholder="Search tasks…" aria-label="Search tasks" />
      <select id="category-filter" aria-label="Filter by category">
        <option value="">All categories</option>
      </select>
      <div class="filter-group" role="group" aria-label="Filter by status">
        <button class="filter-btn active" data-status="">All</button>
        <button class="filter-btn" data-status="incomplete">Incomplete</button>
        <button class="filter-btn" data-status="complete">Complete</button>
      </div>
      <button id="add-task-btn" class="btn btn-primary btn-sm">+ Add Task</button>
    </div>

    <!-- Add / Edit task form (hidden by default) -->
    <div class="task-form-card hidden" id="task-form-card">
      <h2 id="task-form-title">Add Task</h2>
      <form id="task-form" novalidate>
        <input type="hidden" id="edit-task-id" />
        <div class="form-group">
          <label for="task-title">Title <span aria-hidden="true">*</span></label>
          <input type="text" id="task-title" name="title" required maxlength="200"
                 placeholder="e.g. Read chapter 3" />
        </div>
        <div class="form-group">
          <label for="task-description">Description</label>
          <textarea id="task-description" name="description" maxlength="2000"
                    placeholder="Optional notes…"></textarea>
        </div>
        <div class="task-form-row">
          <div class="form-group">
            <label for="task-due-date">Due Date</label>
            <input type="date" id="task-due-date" name="due_date" />
          </div>
          <div class="form-group">
            <label for="task-category">Category</label>
            <input type="text" id="task-category" name="category" maxlength="100"
                   placeholder="e.g. Math" />
          </div>
        </div>
        <p class="error-msg" id="task-form-error" role="alert" aria-live="polite"></p>
        <div class="form-actions">
          <button type="button" id="cancel-task-btn" class="btn btn-ghost">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Task</button>
        </div>
      </form>
    </div>

    <!-- Loading indicator -->
    <div class="loading-indicator hidden" id="loading-indicator" aria-live="polite">Loading tasks…</div>

    <!-- Empty state -->
    <div class="empty-state hidden" id="empty-state">
      <p id="empty-state-msg">No tasks yet. Add one above!</p>
    </div>

    <!-- Task list -->
    <ul class="task-list" id="task-list" aria-label="Task list"></ul>

  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
